const canvas = document.getElementById('particles-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas(); window.addEventListener('resize', resizeCanvas);
class Particle {
    constructor() { this.reset(); }
    reset() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 3 + 1; this.speedX = (Math.random() - 0.5) * 0.5; this.speedY = (Math.random() - 0.5) * 0.5; this.opacity = Math.random() * 0.5 + 0.1; this.color = Math.random() > 0.5 ? '255, 107, 107' : '255, 217, 61'; }
    update() { this.x += this.speedX; this.y += this.speedY; if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset(); }
    draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fillStyle = `rgba(${this.color}, ${this.opacity})`; ctx.fill(); }
}
for (let i = 0; i < 60; i++) particles.push(new Particle());
function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    particles.forEach((p1, i) => { particles.slice(i + 1).forEach(p2 => { const dx = p1.x - p2.x; const dy = p1.y - p2.y; const dist = Math.sqrt(dx * dx + dy * dy); if (dist < 150) { ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.strokeStyle = `rgba(255,255,255,${0.05 * (1 - dist / 150)})`; ctx.lineWidth = 0.5; ctx.stroke(); } }); });
    requestAnimationFrame(animateParticles);
}

function renderQuestionDots() {
    let dotsHtml = '';
    for (let i = 0; i < questions.length; i++) {
        let cls = 'q-dot';
        if (i === currentQuestion) cls += ' active';
        else if (i < currentQuestion) cls += ' answered';
        dotsHtml += `<div class="${cls}"></div>`;
    }
    return `<div class="question-dots">${dotsHtml}</div>`;
}

function selectOptionAndNext(optionIndex) {
    userAnswers[currentQuestion] = optionIndex;
    const q = questions[currentQuestion];
    const points = q.options[optionIndex].points;
    for (const [trait, value] of Object.entries(points)) {
        userScores[trait] = (userScores[trait] || 0) + value;
    }
    currentQuestion++;
    if (currentQuestion >= questions.length) {
        calculateResult();
    } else {
        renderQuestion();
    }
}

function selectGender(gender) {
    userGender = gender;
    userAnswers = [];
    currentQuestion = 0;
    userScores = {};
    revealClicked = false;
    renderQuestion();
}

function renderQuestion() {
    if (currentQuestion >= questions.length) { calculateResult(); return; }
    const q = questions[currentQuestion];
    let optionsHtml = '';
    q.options.forEach((opt, idx) => {
        optionsHtml += `
        <div class="option" onclick="selectOptionAndNext(${idx})">
            <div class="option-icon"><i class="fas fa-${idx === 0 ? 'circle' : (idx === 1 ? 'dot-circle' : (idx === 2 ? 'circle-notch' : 'check-circle'))}"></i></div>
            <div class="option-text">${opt.text}</div>
        </div>`;
    });
    const percent = Math.round(((currentQuestion) / questions.length) * 100);
    const app = document.getElementById('app');
    app.innerHTML = `
    <div class="quiz-screen">
        ${renderQuestionDots()}
        <div class="progress-container">
            <div class="progress-bar"><div class="progress-fill" style="width: ${percent}%"></div></div>
            <div class="progress-text">السؤال ${currentQuestion + 1} من ${questions.length}</div>
            <div class="progress-percentage">${percent}%</div>
        </div>
        <div class="question-text"><i class="fas fa-question-circle"></i> ${q.text}</div>
        <div class="options">${optionsHtml}</div>
    </div>`;
}

function calculateResult() {
    let filteredChars = characters.filter(c => c.gender === userGender);
    if (filteredChars.length === 0) filteredChars = characters;
    bestChar = null;
    bestScore = -1;
    for (const char of filteredChars) {
        let score = 0;
        for (const trait of char.traits) {
            for (const [userTrait, userValue] of Object.entries(userScores)) {
                if (trait.includes(userTrait) || userTrait.includes(trait) || trait.toLowerCase() === userTrait.toLowerCase() || (trait === "قوي" && userTrait === "قوية") || (trait === "قوية" && userTrait === "قوي")) {
                    score += userValue * 2;
                }
            }
        }
        for (const [trait, value] of Object.entries(userScores)) {
            if (char.traits.some(t => t.includes(trait) || trait.includes(t))) score += value;
        }
        if (score > bestScore) { bestScore = score; bestChar = char; }
    }
    if (!bestChar) bestChar = filteredChars[0];
    similarityPercent = Math.min(98, Math.max(65, Math.round((bestScore / 30) * 100)));
    renderRevealScreen();
}

function renderRevealScreen() {
    const app = document.getElementById('app');
    app.innerHTML = `
    <div class="result-screen">
        <div class="result-card">
            <h1><i class="fas fa-trophy"></i> النتيجة جاهزة! <i class="fas fa-star"></i></h1>
            <div class="subtitle">اكتشف شخصية الأنمي التي تشبهك</div>
            <button class="btn reveal-btn" onclick="handleRevealClick()">
                <i class="fas fa-magic"></i> شخصيتك هي...
            </button>
        </div>
    </div>`;
}

function handleRevealClick() {
    if (!revealClicked) {
        revealClicked = true;
        showAdPopup();
    } else {
        showCountdown();
    }
}

function showAdPopup() {
    const overlay = document.getElementById('ad-popup-overlay');
    const countdownEl = document.getElementById('ad-countdown');
    overlay.style.display = 'flex';
    let count = 10;
    countdownEl.textContent = count;
    const interval = setInterval(() => {
        count--;
        countdownEl.textContent = count;
        if (count <= 0) {
            clearInterval(interval);
            overlay.style.display = 'none';
            showCountdown();
        }
    }, 1000);
}

function showCountdown() {
    const overlay = document.createElement('div');
    overlay.className = 'countdown-overlay';
    overlay.id = 'countdown-overlay';
    overlay.innerHTML = `<div class="countdown-number" id="countdown-num">10</div><div class="countdown-text">جاري تحميل نتيجتك...</div>`;
    document.body.appendChild(overlay);
    let count = 10;
    const interval = setInterval(() => {
        count--;
        const numEl = document.getElementById('countdown-num');
        if (numEl) numEl.textContent = count;
        if (count <= 0) {
            clearInterval(interval);
            const ov = document.getElementById('countdown-overlay');
            if (ov) ov.remove();
            renderResult(bestChar);
        }
    }, 1000);
}

                    <div class="share-btn instagram" onclick="shareOnInstagram()"><i class="fab fa-instagram"></i> إنستغرام</div>
                    <div class="share-btn download-img" onclick="generateShareImage()"><i class="fas fa-download"></i> تحميل صورة</div>
                    <div class="share-btn copy-link" onclick="copyLink()"><i class="fas fa-link"></i> نسخ الرابط</div>
                </div>
            </div>
            <button class="btn restart-btn" onclick="restartQuiz()"><i class="fas fa-redo-alt"></i> ابدأ من جديد</button>
        </div>
        <footer>جميع الصور والحقوق مملوكة لأصحابها، تستخدم لأغراض توضيحية فقط</footer>
    </div>`;
}

function restartQuiz() {
    userGender = null;
    currentQuestion = 0;
    userAnswers = [];
    userScores = {};
    bestChar = null;
    bestScore = 0;
    similarityPercent = 0;
    revealClicked = false;
    renderStart();
}

renderStart();
