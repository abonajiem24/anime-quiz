<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>اختبار شخصية الأنمي - اكتشف من يشبهك!</title>
    
    <meta property="og:title" content="اختبار شخصية الأنمي - اكتشف من يشبهك!" />
    <meta property="og:description" content="أجب على 15 سؤالاً واكتشف أي شخصية أنمي تشبهك من بين 80 شخصية!" />
    <meta property="og:image" content="https://i.ibb.co/6JcyjvSc/eren.jpg" />
    <meta property="og:url" content="https://tsali2.blogspot.com/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: url('https://i.ibb.co/tpf7fBPh/back.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            pointer-events: none;
            z-index: 0;
        }
        .container { max-width: 800px; margin: 0 auto; position: relative; z-index: 1; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .start-screen, .quiz-screen, .result-screen {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
            animation: fadeInUp 0.5s ease-out;
        }
        h1 { text-align: center; font-size: 32px; margin-bottom: 10px; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        h1 i { margin: 0 10px; }
        .subtitle { text-align: center; color: rgba(255,255,255,0.9); margin-bottom: 30px; }
        h2 { margin-bottom: 20px; font-size: 22px; color: #fff; }
        .question-text {
            font-size: 20px;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            text-align: center;
            font-weight: 500;
        }
        .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .option:hover { background: rgba(255,255,255,0.25); transform: translateX(8px); }
        .option-text { flex: 1; font-size: 16px; color: white; }
        .option-icon { margin-left: 15px; font-size: 20px; color: #ffd93d; }
        .progress-container { margin-bottom: 25px; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff6b6b, #ffd93d); border-radius: 10px; transition: width 0.3s ease; }
        .progress-text { text-align: center; margin-top: 8px; font-size: 14px; color: rgba(255,255,255,0.8); }
        .btn {
            background: linear-gradient(135deg, #ff6b6b, #ff4757);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-block;
            font-family: 'Tajawal', sans-serif;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 5px 20px rgba(255,107,107,0.4); }
        .gender-buttons { display: flex; gap: 20px; justify-content: center; margin: 30px 0; }
        .gender-btn { padding: 15px 40px; font-size: 18px; background: rgba(255,255,255,0.2); backdrop-filter: blur(5px); }
        .gender-btn:hover { background: #ff6b6b; }
        .result-card { text-align: center; }
        .result-card img { max-width: 220px; border-radius: 50%; margin: 20px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 4px solid rgba(255,255,255,0.5); }
        .result-name { font-size: 32px; font-weight: 800; color: #ffd93d; margin-bottom: 5px; }
        .result-anime { font-size: 18px; color: rgba(255,255,255,0.9); margin-bottom: 20px; }
        .result-similarity { background: rgba(0,0,0,0.3); padding: 18px; border-radius: 20px; margin: 20px 0; font-size: 18px; color: white; }
        .share-buttons { display: flex; gap: 12px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
        .share-btn { padding: 10px 18px; border-radius: 40px; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: white; }
        .facebook { background: #1877f2; }
        .twitter { background: #1da1f2; }
        .whatsapp { background: #25d366; }
        .instagram { background: linear-gradient(45deg, #f09433, #d62976, #962fbf); }
        .copy-link { background: #6c5ce7; }
        .restart-btn { background: linear-gradient(135deg, #4ecdc4, #44bdaf); margin-top: 15px; }
        footer { text-align: center; margin-top: 30px; font-size: 12px; color: rgba(255,255,255,0.6); }
        @media (max-width: 600px) {
            .container { padding: 0 10px; }
            .start-screen, .quiz-screen, .result-screen { padding: 20px; }
            .question-text { font-size: 18px; }
            .option-text { font-size: 14px; }
            .result-name { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container" id="app"></div>

    <script>
        // رابط مدونتك
        const MY_BLOG_URL = "https://tsali2.blogspot.com/";
        
        // جميع الشخصيات (مختصرة للتوضيح - أضف كل شخصياتك هنا)
        const characters = [
            { id: "eren", displayName: "إيرين ييغر", anime: "attack", traits: ["حرية", "إنتقام", "عمالقة"], similarity: "السعي للحرية مهما كان الثمن", image: "https://i.ibb.co/6JcyjvSc/eren.jpg", gender: "male" },
            { id: "levi", displayName: "ليفاي أكرمان", anime: "attack", traits: ["نظافة", "قوة", "برود"], similarity: "الانضباط والدقة بلا تهاون", image: "https://i.ibb.co/hxFzY04B/levi.jpg", gender: "male" },
            { id: "mikasa", displayName: "ميكاسا أكرمان", anime: "attack", traits: ["ولاء", "وشاح", "قوة"], similarity: "الولاء والحماية لمن تحب", image: "https://i.ibb.co/wrSj52nh/mikasa.jpg", gender: "female" },
            { id: "naruto", displayName: "ناروتو أوزوماكي", anime: "naruto", traits: ["مصر", "شجاع", "طيب"], similarity: "الإصرار على تحقيق الحلم رفضاً للوحدة", image: "https://i.ibb.co/9kkpSxKQ/naruto.jpg", gender: "male" },
            { id: "sasuke", displayName: "ساسكي أوتشيها", anime: "naruto", traits: ["طموح", "بارد", "نادم"], similarity: "السعي للانتقام ثم البحث عن الحقيقة", image: "https://i.ibb.co/hFkzX4LY/sasuke.jpg", gender: "male" },
            { id: "kakashi", displayName: "كاكاشي هاتاكي", anime: "naruto", traits: ["ذكي", "هادئ", "غامض"], similarity: "الذكاء الحاد مع حب الكتب المثيرة", image: "https://i.ibb.co/dJ7YJmJn/kakashi.jpg", gender: "male" },
            { id: "luffy", displayName: "مونكي دي لوفي", anime: "One Piece", traits: ["مغامر", "مصر", "طيب"], similarity: "حب الحرية مع حماية الأصدقاء", image: "https://i.ibb.co/KxmBsc89/luffy.jpg", gender: "male" },
            { id: "zoro", displayName: "رورونوا زورو", anime: "One Piece", traits: ["قوي", "مخلص", "طموح"], similarity: "السعي لهدف الأقوى بلا خوف", image: "https://i.ibb.co/nsJQsYxM/zoro.jpg", gender: "male" },
            { id: "gojo", displayName: "غوجو ساتورو", anime: "jujutsu", traits: ["قوي", "واثق", "مرح"], similarity: "القوة المطلقة مع ثقة فائقة بالنفس", image: "https://i.ibb.co/5WCt8Gzm/gojo.jpg", gender: "male" }
        ];
        
        // الأسئلة (15 سؤالاً - مختصرة للتوضيح)
        const questions = [
            { text: "ما هو لون شعرك الحالي؟", options: [
                { text: "أسود داكن أو بني غامق جداً", points: { "هادئ": 1, "غامض": 1 } },
                { text: "بني فاتح، كستنائي، أو مصبوغ/ملون", points: { "اجتماعي": 1, "طبيعي": 1 } },
                { text: "أشقر، أحمر، أو مائل للأبيض/الرمادي", points: { "حر": 1, "جريء": 1 } },
                { text: "أسود نفاث وثائر", points: { "متمرد": 1, "قوي": 1 } }
            ] },
            { text: "كيف هي بنيتك الجسدية؟", options: [
                { text: "متوسط الطول وبنية عادية", points: { "متوازن": 1 } },
                { text: "طويل القامة وبنية قوية", points: { "قوي": 2 } },
                { text: "نحيف أو رشيق", points: { "ذكي": 1, "سريع": 1 } },
                { text: "قصير القامة", points: { "متواضع": 1, "عنيد": 1 } }
            ] }
        ];
        
        // حالة التطبيق
        let userGender = null;
        let currentQuestion = 0;
        let userAnswers = [];
        let userScores = {};
        
        function getAnimeName(animeCode) {
            const names = { "attack": "هجوم العمالقة", "naruto": "ناروتو", "One Piece": "ون بيس", "jujutsu": "جوجوتسو كايسن" };
            return names[animeCode] || animeCode;
        }
        
        // تحديث الرابط ليحتوي على الشخصية الحالية
        function updateUrlWithCharacter(characterId) {
            const url = new URL(window.location.href);
            url.searchParams.set('character', characterId);
            window.history.pushState({}, '', url);
        }
        
        // الحصول على اسم الشخصية من الرابط
        function getCharacterFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('character');
        }
        
        // عرض نتيجة الشخصية مباشرة (عند فتح رابط مع ?character=xxx)
        function showCharacterResult(characterId) {
            const character = characters.find(c => c.id === characterId);
            if (character) {
                renderResult(character);
                return true;
            }
            return false;
        }
        
        // دوال المشاركة (تشارك الرابط مع اسم الشخصية)
        function shareOnFacebook(characterId, characterName) {
            const url = `${window.location.origin}${window.location.pathname}?character=${characterId}`;
            const text = `🎭 اكتشفت أن شخصية الأنمي الشبيهة بي هي ${characterName}! اختبر شخصيتك الآن:`;
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}&quote=${encodeURIComponent(text)}`, '_blank');
        }
        
        function shareOnTwitter(characterId, characterName) {
            const url = `${window.location.origin}${window.location.pathname}?character=${characterId}`;
            const text = `🎭 اكتشفت أن شخصية الأنمي الشبيهة بي هي ${characterName}! اختبر شخصيتك الآن:`;
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`, '_blank');
        }
        
        function shareOnWhatsapp(characterId, characterName) {
            const url = `${window.location.origin}${window.location.pathname}?character=${characterId}`;
            const text = `🎭 اكتشفت أن شخصية الأنمي الشبيهة بي هي ${characterName}! اختبر شخصيتك الآن: ${url}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }
        
        function shareOnInstagram(characterId, characterName, characterImage) {
            const text = `🎭 شخصية الأنمي الشبيهة بي هي ${characterName}! اختبر شخصيتك الآن: ${window.location.origin}${window.location.pathname}?character=${characterId}`;
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = characterImage;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height + 70;
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, img.height, canvas.width, 70);
                ctx.drawImage(img, 0, 0, img.width, img.height);
                ctx.fillStyle = '#ffd93d';
                ctx.font = 'bold 18px Tajawal';
                ctx.fillText(characterName, 15, img.height + 30);
                ctx.fillStyle = '#ffffff';
                ctx.font = '14px Tajawal';
                ctx.fillText('شخصية الأنمي الشبيهة بي', 15, img.height + 55);
                const link = document.createElement('a');
                link.download = `anime_character_${characterName}.png`;
                link.href = canvas.toDataURL();
                link.click();
                alert('✅ تم تحميل الصورة! يمكنك الآن فتح انستغرام ومشاركتها مع النص:\n\n' + text);
            };
            img.onerror = function() {
                window.open('https://www.instagram.com/', '_blank');
                alert('📝 انسخ هذا النص وشاركه على انستغرام:\n\n' + text);
            };
        }
        
        function copyLink(characterId) {
            const url = `${window.location.origin}${window.location.pathname}?character=${characterId}`;
            navigator.clipboard.writeText(url).then(() => {
                alert('✅ تم نسخ رابط النتيجة! يمكنك مشاركته الآن.');
            }).catch(() => {
                alert('❌ فشل النسخ، يمكنك نسخ الرابط يدويًا.');
            });
        }
        
        function selectOptionAndNext(optionIndex) {
            userAnswers[currentQuestion] = optionIndex;
            const points = questions[currentQuestion].options[optionIndex].points;
            for (const [trait, value] of Object.entries(points)) {
                userScores[trait] = (userScores[trait] || 0) + value;
            }
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                calculateResult();
            } else {
                renderQuestion();
            }
        }
        
        function renderStart() {
            document.getElementById('app').innerHTML = `
                <div class="start-screen">
                    <h1><i class="fas fa-mask"></i> اختبار شخصية الأنمي <i class="fas fa-dragon"></i></h1>
                    <div class="subtitle">اكتشف أي شخصية أنمي تشبهك!</div>
                    <h2 style="text-align:center;">اختر جنسك:</h2>
                    <div class="gender-buttons">
                        <button class="btn gender-btn" onclick="selectGender('male')"><i class="fas fa-mars"></i> ذكر</button>
                        <button class="btn gender-btn" onclick="selectGender('female')"><i class="fas fa-venus"></i> أنثى</button>
                    </div>
                    <footer>سيتم عرض شخصية أنمي تناسب جنسك بناءً على إجاباتك</footer>
                </div>
            `;
        }
        
        function selectGender(gender) {
            userGender = gender;
            userAnswers = [];
            currentQuestion = 0;
            userScores = {};
            renderQuestion();
        }
        
        function renderQuestion() {
            if (currentQuestion >= questions.length) {
                calculateResult();
                return;
            }
            const q = questions[currentQuestion];
            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                optionsHtml += `<div class="option" onclick="selectOptionAndNext(${idx})"><div class="option-icon"><i class="fas fa-${idx === 0 ? 'circle' : 'circle'}"></i></div><div class="option-text">${opt.text}</div></div>`;
            });
            document.getElementById('app').innerHTML = `
                <div class="quiz-screen">
                    <div class="progress-container">
                        <div class="progress-bar"><div class="progress-fill" style="width: ${(currentQuestion / questions.length) * 100}%"></div></div>
                        <div class="progress-text">السؤال ${currentQuestion + 1} من ${questions.length}</div>
                    </div>
                    <div class="question-text"><i class="fas fa-question-circle"></i> ${q.text}</div>
                    <div class="options">${optionsHtml}</div>
                </div>
            `;
        }
        
        function calculateResult() {
            let filteredChars = characters.filter(c => c.gender === userGender);
            if (filteredChars.length === 0) filteredChars = characters;
            let bestChar = filteredChars[0];
            renderResult(bestChar);
        }
        
        function renderResult(character) {
            // تحديث الرابط ليحتوي على اسم الشخصية
            updateUrlWithCharacter(character.id);
            
            document.getElementById('app').innerHTML = `
                <div class="result-screen">
                    <div class="result-card">
                        <h1><i class="fas fa-trophy"></i> نتيجتك <i class="fas fa-star"></i></h1>
                        <img src="${character.image}" alt="${character.displayName}">
                        <div class="result-name">${character.displayName}</div>
                        <div class="result-anime"><i class="fas fa-film"></i> ${getAnimeName(character.anime)}</div>
                        <div class="result-similarity">
                            <i class="fas fa-hand-peace"></i> <strong>وجه التشابه:</strong><br>
                            ${character.similarity}
                        </div>
                        <div class="share-buttons">
                            <div class="share-btn facebook" onclick="shareOnFacebook('${character.id}', '${character.displayName}')"><i class="fab fa-facebook-f"></i> فيسبوك</div>
                            <div class="share-btn twitter" onclick="shareOnTwitter('${character.id}', '${character.displayName}')"><i class="fab fa-twitter"></i> تويتر</div>
                            <div class="share-btn whatsapp" onclick="shareOnWhatsapp('${character.id}', '${character.displayName}')"><i class="fab fa-whatsapp"></i> واتساب</div>
                            <div class="share-btn instagram" onclick="shareOnInstagram('${character.id}', '${character.displayName}', '${character.image}')"><i class="fab fa-instagram"></i> انستغرام</div>
                            <div class="share-btn copy-link" onclick="copyLink('${character.id}')"><i class="fas fa-link"></i> نسخ الرابط</div>
                        </div>
                        <button class="btn restart-btn" onclick="restartQuiz()"><i class="fas fa-redo-alt"></i> ابدأ من جديد</button>
                    </div>
                    <footer>جميع الصور والحقوق مملوكة لأصحابها</footer>
                </div>
            `;
        }
        
        function restartQuiz() {
            userGender = null;
            currentQuestion = 0;
            userAnswers = [];
            userScores = {};
            // إزالة المعلمة من الرابط
            window.history.pushState({}, '', window.location.pathname);
            renderStart();
        }
        
        // بدء التشغيل: نتحقق من وجود شخصية في الرابط
        const characterFromUrl = getCharacterFromUrl();
        if (characterFromUrl && showCharacterResult(characterFromUrl)) {
            // تم عرض النتيجة مباشرة من الرابط
        } else {
            renderStart();
        }
    </script>

</body>
