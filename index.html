    <style>
        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;

            min-height: 100vh;
            padding: 20px;
            position: relative;

            /* طبقة شفافة فوق الخلفية */
            body::before {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: url('https://www.transparenttextures.com/patterns/anime-pattern.png') repeat;
                opacity: 0.05;
                pointer-events: none;
                z-index: 0;
            }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* أنيميشن للظهور */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .start-screen, .quiz-screen, .result-screen {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
            animation: fadeInUp 0.5s ease-out;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);

            h1 i {

            }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.9);
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 22px;
            color: #fff;
        }

        .question-text {
            font-size: 20px;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            text-align: center;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }

            .option:hover {
                background: rgba(255,255,255,0.25);
                transform: translateX(8px);
                border-color: rgba(255,255,255,0.5);
            }

            .option.selected {
                background: rgba(255,107,107,0.5);
                border-color: #ff6b6b;
                box-shadow: 0 0 15px rgba(255,107,107,0.3);
            }

        .option-text {
            flex: 1;
            font-size: 16px;
        }

        .option-icon {
            margin-right: 15px;
            font-size: 20px;
        }

        /* شريط التقدم */
        .progress-container {
            margin-bottom: 25px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            margin-top: 8px;
            font-size: 14px;
            color: rgba(255,255,255,0.8);
        }

        /* أزرار */
        .btn {
            background: linear-gradient(135deg, #ff6b6b, #ff4757);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-block;
            font-family: 'Tajawal', sans-serif;
        }

            .btn:hover {
                transform: scale(1.05);
                box-shadow: 0 5px 20px rgba(255,107,107,0.4);
            }

        .gender-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
        }

        .gender-btn {
            padding: 15px 40px;
            font-size: 18px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
        }

            .gender-btn:hover {
                background: #ff6b6b;
            }

        .result-card {
            text-align: center;
        }

            .result-card img {
                max-width: 220px;
                border-radius: 50%;
                margin: 20px 0;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                border: 4px solid rgba(255,255,255,0.5);
                transition: transform 0.3s;
            }

            font-weight: 800;
            color: #ffd93d;

            margin: 20px 0;

            gap: 15px;
            justify-content: center;

        }

                text: "ما هي الفلسفة العقلية التي تطبقها في إدارة حياتك؟", options: [
                    { text: "'الغاية تبرر الوسيلة' (المهم هو النتيجة والوصول للهدف مهما كانت التضحيات)", points: { "طموح": 2, "قاسٍ": 1 } },
                    { text: "'عش يومك بحرية وبساطة' (الحياة قصيرة ولا داعي لتعقيد الأمور بالتفكير الزائد)", points: { "حر": 3 } },
                    { text: "'احترام الذات والقوة هما كل شيء' (في هذا العالم، الضعيف لا مكان له)", points: { "قوي": 2, "فخور": 1 } },
                    { text: "'العقل والهدوء هما السلاح الأقوى' (من يفقد أعصابه وتركيزه يخسر دائماً)", points: { "حكيم": 2, "منضبط": 1 } }
                ]
            }
        ];

        // ============================================
        // منطق الاختبار (دوال المعدلة للمشاركة)
        // ============================================
        let userGender = null;
        let currentQuestion = 0;
        let userAnswers = [];
        let userScores = {};

        // دوال مساعدة
        function getAnimeName(animeCode) {
            const animeNames = {
                "attack": "هجوم العمالقة",
                "black": "بلاك كلوفر",
                "jujutsu": "جوجوتسو كايسن",
                "dragon": "دراغون بول",
                "death": "ديث نوت",
                "Demon": "قاتل الشياطين",
                "naruto": "ناروتو",
                "One Piece": "ون بيس"
            };
            return animeNames[animeCode] || animeCode;
        }

        // ============================================
        // دوال المشاركة المعدلة - ترسل رابط مدونتك
        // ============================================
        function shareOnFacebook(characterName) {
            const url = MY_BLOG_URL;
            const text = `🎭 اكتشفت أن شخصية الأنمي الشبيهة بي هي ${characterName}! اختبر شخصيتك الآن:`;
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}&quote=${encodeURIComponent(text)}`, '_blank');
        }

        function shareOnTwitter(characterName) {
            const url = MY_BLOG_URL;
            const text = `🎭 اكتشفت أن شخصية الأنمي الشبيهة بي هي ${characterName}! اختبر شخصيتك الآن:`;
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`, '_blank');
        }

        function shareOnWhatsapp(characterName) {
            const url = MY_BLOG_URL;
            const text = `🎭 اكتشفت أن شخصية الأنمي الشبيهة بي هي ${characterName}! اختبر شخصيتك الآن: ${url}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        function copyLink() {
            const url = MY_BLOG_URL;
            navigator.clipboard.writeText(url).then(() => {
                alert('✅ تم نسخ رابط الاختبار! يمكنك مشاركته الآن.');
            }).catch(() => {
                alert('❌ فشل النسخ، يمكنك نسخ الرابط يدويًا.');
            });
        }

        function updateProgress() {
            const fill = document.querySelector('.progress-fill');
            const text = document.querySelector('.progress-text');
            if (fill && text) {
                const percent = ((currentQuestion) / questions.length) * 100;
                fill.style.width = `${percent}%`;
                text.innerText = `السؤال ${currentQuestion} من ${questions.length}`;
            }
        }

        function selectOptionAndNext(optionIndex) {
            userAnswers[currentQuestion] = optionIndex;

            const q = questions[currentQuestion];
            const points = q.options[optionIndex].points;
            for (const [trait, value] of Object.entries(points)) {
                userScores[trait] = (userScores[trait] || 0) + value;
            }

            currentQuestion++;

            if (currentQuestion >= questions.length) {
                calculateResult();
            } else {
                renderQuestion();
            }
        }

        function renderStart() {
            const app = document.getElementById('app');
            app.innerHTML = `
            <div class="start-screen">
              <h1><i class="fas fa-mask"></i> اختبار شخصية الأنمي <i class="fas fa-dragon"></i></h1>
              <div class="subtitle">اكتشف أي شخصية أنمي تشبهك!</div>
              <h2 style="text-align:center;">اختر جنسك:</h2>
              <div class="gender-buttons">
                <button class="btn gender-btn" onclick="selectGender('male')"><i class="fas fa-mars"></i> ذكر</button>
                <button class="btn gender-btn" onclick="selectGender('female')"><i class="fas fa-venus"></i> أنثى</button>
              </div>
              <footer>سيتم عرض شخصية أنمي تناسب جنسك بناءً على إجاباتك</footer>
            </div>
          `;
        }

        function selectGender(gender) {
            userGender = gender;
            userAnswers = [];
            currentQuestion = 0;
            userScores = {};
            renderQuestion();
        }

        function renderQuestion() {
            if (currentQuestion >= questions.length) {
                calculateResult();
                return;
            }

            const q = questions[currentQuestion];
            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                optionsHtml += `
              <div class="option" onclick="selectOptionAndNext(${idx})">
                <div class="option-icon"><i class="fas fa-${idx === 0 ? 'circle' : (idx === 1 ? 'dot-circle' : (idx === 2 ? 'circle-notch' : 'check-circle'))}"></i></div>
                <div class="option-text">${opt.text}</div>
              </div>
            `;
            });

            const app = document.getElementById('app');
            app.innerHTML = `
            <div class="quiz-screen">
              <div class="progress-container">
                <div class="progress-bar"><div class="progress-fill" style="width: ${(currentQuestion / questions.length) * 100}%"></div></div>
                <div class="progress-text">السؤال ${currentQuestion + 1} من ${questions.length}</div>
              </div>
              <div class="question-text">
                <i class="fas fa-question-circle"></i> ${q.text}
              </div>
              <div class="options">
                ${optionsHtml}
              </div>
            </div>
          `;
        }

        function calculateResult() {
            let filteredChars = characters.filter(c => c.gender === userGender);
            if (filteredChars.length === 0) filteredChars = characters;

            let bestChar = null;
            let bestScore = -1;

            for (const char of filteredChars) {
                let score = 0;
                for (const trait of char.traits) {
                    for (const [userTrait, userValue] of Object.entries(userScores)) {
                        if (trait.includes(userTrait) || userTrait.includes(trait) ||
                            trait.toLowerCase() === userTrait.toLowerCase() ||
                            (trait === "قوي" && userTrait === "قوية") ||
                            (trait === "قوية" && userTrait === "قوي")) {
                            score += userValue * 2;
                        }
                    }
                }
                for (const [trait, value] of Object.entries(userScores)) {
                    if (char.traits.some(t => t.includes(trait) || trait.includes(t))) {
                        score += value;
                    }
                }
                if (score > bestScore) {
                    bestScore = score;
                    bestChar = char;
                }
            }

            if (!bestChar) bestChar = filteredChars[0];
            renderResult(bestChar);
        }

        function renderResult(character) {
            const app = document.getElementById('app');
            app.innerHTML = `
            <div class="result-screen">
              <div class="result-card">
                <h1><i class="fas fa-trophy"></i> نتيجتك <i class="fas fa-star"></i></h1>
                <img src="${character.image}" alt="${character.displayName}" onerror="this.src='https://via.placeholder.com/250x250?text=No+Image'">
                <div class="result-name">${character.displayName}</div>
                <div class="result-anime"><i class="fas fa-film"></i> ${getAnimeName(character.anime)}</div>
                <div class="result-similarity">
                  <i class="fas fa-hand-peace"></i> <strong>وجه التشابه:</strong><br>
                  ${character.similarity}
                </div>

                <div class="share-buttons">
                  <div class="share-btn facebook" onclick="shareOnFacebook('${character.displayName}')"><i class="fab fa-facebook-f"></i> فيسبوك</div>
                  <div class="share-btn twitter" onclick="shareOnTwitter('${character.displayName}')"><i class="fab fa-twitter"></i> تويتر</div>
                  <div class="share-btn whatsapp" onclick="shareOnWhatsapp('${character.displayName}')"><i class="fab fa-whatsapp"></i> واتساب</div>
                  <div class="share-btn copy-link" onclick="copyLink()"><i class="fas fa-link"></i> نسخ الرابط</div>
                </div>

                <button class="btn restart-btn" onclick="restartQuiz()"><i class="fas fa-redo-alt"></i> ابدأ من جديد</button>
              </div>
              <footer>جميع الصور والحقوق مملوكة لأصحابها، تستخدم لأغراض توضيحية فقط</footer>
            </div>
          `;
        }

        function restartQuiz() {
            userGender = null;
            currentQuestion = 0;
            userAnswers = [];
            userScores = {};
            renderStart();
        }

        // بدء التشغيل
        renderStart();
    </script>
</body>
</html>
